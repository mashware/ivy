[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Without the default features, which multiply the packages and with them the time
# `clippy --workspace --all-targets` takes — and this milestone runs it constantly. What stays out is
# not only `wgpu` and accessibility: also `links` (opening URLs, which a terminal will want the day it
# supports OSC 8), the web screen reader and `winit/default` — hence the `winit` dependency that
# `crates/app` declares to put back one of the things that default used to bring.
# The last three here are not optional: without `default_fonts` there is nothing to paint text with,
# and without the two window backends there is no window on Linux.
# Careful about trimming further: today `libwayland` is loaded at run time because the `dlopen`
# feature arrives indirectly, through the clipboard. Dropping the clipboard would bring it down, and
# then compiling would demand libwayland and the binary would stop starting on an X11 machine
# without it.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
