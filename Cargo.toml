[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
# Without the default features, which multiply the packages and with them the time
# `clippy --workspace --all-targets` takes — and this milestone runs it constantly. What stays out is
# not only `wgpu` and accessibility: also the web screen reader and `winit/default` — hence the
# `winit` dependency that `crates/app` declares to put back one of the things that default used to
# bring. `default_fonts` is not optional because without it there is nothing to paint text with, nor
# are the two window backends because without them there is no window on Linux. `links` stays out
# although this terminal opens links (D51): its hand-off reports a failure only through `log`, which
# this binary never installs, so `crates/app` calls the same opener itself and hears the errors it
# reports.
# Careful about trimming further: today `libwayland` is loaded at run time because the `dlopen`
# feature arrives indirectly, through the clipboard. Dropping the clipboard would bring it down, and
# then compiling would demand libwayland and the binary would stop starting on an X11 machine
# without it.
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }

# **The only patched dependency in this repository, and it exists because the fix is not ours to
# make.** `egui-winit` recognises the paste chord, reads the clipboard as text and, finding none,
# returns without emitting anything — not the paste, and not the key event either. So `Ctrl+V` over a
# clipboard holding an image, or holding nothing, reaches the program inside a console as **nothing at
# all**, and D11's promise —that chord is worth what its control byte is worth— cannot be kept. The
# copy under `vendor/` changes one `return` into a conditional one — and, since #274, keeps Shift out
# of the Ctrl+X that `is_cut_command` claims, so the close chord arrives as a key; everything else is
# the published 0.36.1, byte for byte.
#
# **Why a copy in the tree and not a fork on a server:** F2.7 is the first build on macOS and Windows,
# and a path needs neither a fetch nor credentials, so it resolves identically on all three. And a
# copy sits in the diff, where a reviewer reads it, instead of behind a URL nobody opens.
#
# What it is **not** justified by, because it was believed for an afternoon and is false: that a test
# inside this copy could drive the bug. `KeyEvent`'s field is private to `winit` itself, so being one
# crate closer buys nothing — no test anywhere can build that event. See `tests/vendor_patch.rs`.
#
# Reported upstream as emilk/egui#4065, open since 2024. The day it lands, this section and the
# directory go away together. **D33.**
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
