# **The command that makes the `deny` on broken links bite, with a name so that it exists.**
#
# The four `lib.rs` deny `rustdoc::broken_intra_doc_links`, and that only really bites with
# `--document-private-items`: without that flag rustdoc does not resolve the links of private items,
# and `app` is almost entirely private. The command people type out of habit is `cargo doc`, and that
# one walks past a broken link **in silence**.
#
# Without this alias, the only door to that guard was remembering a flag written in a comment **inside
# the file the guard protects**. With it, the door has a name: `cargo doc-check`. It is not a test —
# this repository has no continuous integration, and `cargo doc` inside a `#[test]` deadlocks against
# its own build directory — but it turns «you have to remember a flag» into «there is a command called
# this».
[alias]
doc-check = "doc --workspace --no-deps --document-private-items"
