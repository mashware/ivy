console .prompt{margin-top:18px}.cursor{display:inline-block;background:#b5bfd3;width:7px;height:15px;vertical-align:-2px}.information{width:218px;flex-shrink:0;border-left:1px solid #32363e;background:#1e2127;padding:18px 16px;overflow:auto;font-size:11px;line-height:1.6}.information .eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#9099ab}.information h3{font-size:13px;line-height:1.5;font-weight:500;margin:8px 0 17px;color:#dce1ec}.attention{color:#e7bd83;padding:7px 0 14px;border-bottom:1px solid #34383f;margin-bottom:15px}.step{margin:12px 0;color:#a1a9b8;display:flex;gap:8px}.step.done{color:#8aab82}.step.current{color:#d5dce9}.panel-foot{margin-top:24px;color:#737d90;font-size:10px}.searchbar{position:absolute;right:12px;top:9px;z-index:3;display:flex;align-items:center;gap:4px;background:#303540;border:1px solid #59657c;padding:5px;border-radius:6px;box-shadow:0 8px 25px #0006}.searchbar input{width:155px;background:#1d2027;border:1px solid #4a5364;border-radius:3px;color:#edf0f7;padding:6px 8px;outline:none}.searchbar button{width:25px;height:27px}.search-count{font-size:10px;color:#a6afbf;padding:0 5px}mark{background:#d9af66;color:#191b1f;border-radius:2px}.menu{position:absolute;right:105px;top:45px;z-index:10;background:#292d34;border:1px solid #484d58;box-shadow:0 12px 35px #0008;border-radius:8px;padding:6px;width:240px}.menu button{width:100%;padding:9px 11px;justify-content:flex-start;font-size:12px}.menu kbd{margin-left:auto;color:#8f98aa;font:10px system-ui}.menu hr{border:0;border-top:1px solid #414650;margin:5px}.statusbar{height:25px;min-height:25px;background:#202227;border-top:1px solid #30343c;display:flex;align-items:center;justify-content:space-between;padding:0 13px;color:#8b94a5;font-size:10px}.statusbar b{font-weight:400;color:#bac4d8}.zoom-note{color:#c2cde4}.toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);padding:10px 18px;border:1px solid #515a6e;border-radius:7px;background:#303642;color:#e1e7f2;z-index:40;font-size:12px;box-shadow:0 8px 30px #0006}dialog{color:var(--text);background:#24272e;border:1px solid #4b5260;border-radius:10px;padding:0;width:570px;max-width:calc(100vw - 30px);box-shadow:0 30px 100px #0008}dialog::backdrop{background:#05070b80;backdrop-filter:blur(3px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid #3a3f49;font-weight:600}.settings-body{display:flex;min-height:255px}.settings-nav{width:135px;padding:16px 10px;border-right:1px solid #383d47}.settings-nav button{width:100%;justify-content:flex-start;padding:9px;font-size:12px}.settings-nav button.selected{background:#3b455b;color:#d8e4ff}.settings-fields{padding:24px;flex:1}.field{margin-bottom:20px}.field label{display:block;font-size:12px;margin-bottom:9px}.field select,.field input[type=number]{width:100%;background:#1b1e24;border:1px solid #4a5261;padding:8px;color:#d5ddea;border-radius:5px}.field small{display:block;margin-top:8px;font-size:11px;color:#929bae}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid #393e48}.dialog-foot button{padding:8px 17px;border:1px solid #4a5262}.primary{background:#a6b9e4;color:#172033;border-color:#a6b9e4!important}.primary:hover{background:#bdcdf0}.native .titlebar{height:74px;min-height:74px;padding-top:25px}.native .titlebar:before{content:'agent-terminal';position:absolute;top:0;left:0;right:0;height:25px;text-align:center;background:#35383e;font-size:11px;line-height:25px;color:#cad0dc}.native .window-control{display:none}.window.expanded{position:fixed;inset:0;margin:0;height:100dvh;border-radius:0;z-index:20}[hidden]{display:none!important}@media(max-width:850px){.information{width:175px;padding:12px}.app-title small{display:none}.pane-branch{display:none}.console{padding:12px;font-size:11px}.tab{min-width:120px}.demo-caption{padding:0 12px}.window{margin-left:8px;margin-right:8px}}@media(max-width:600px){.app-title{display:none}.information{width:130px;padding:10px}.tab{min-width:100px;gap:12px;padding:0 8px}.demo-caption span{display:none}.pane-header{padding-left:7px}.pane-name{font-size:11px}.pane-actions button{width:22px}.settings-nav{width:105px}.settings-fields{padding:18px}.menu{right:14px}.searchbar input{width:110px}.workspace{overflow:auto}.console{font-size:10px}.window{min-height:450px}}

<script>
const $=s=>document.querySelector(s), icon=n=>`<svg aria-hidden="true"><use href="#${n}"></use></svg>`;
const actions={'split-right':'split-right','split-down':'split-down','new-tab':'plus',search:'search',menu:'menu',minimize:'minus','window-max':'maximize','window-close':'close','cancel-settings':'close'};
document.querySelectorAll('button[data-action]').forEach(b=>{if(!b.textContent.trim()&&actions[b.dataset.action])b.innerHTML=icon(actions[b.dataset.action])});
let nextId=4,activeTab=1,focused=1,zoom=null,searchOpen=false,query='',matchIndex=0,draft={},settingsSection='Appearance',applied={theme:'Graphite',size:13,blink:true};
const fixtures={
1:{name:'agent-terminal',branch:'main',text:'<span class="dim">~/Mashware/agent-terminal</span>\n\n<span class="blue">❯</span> <span class="green">codex</span>\n\n<span class="blue">› OpenAI Codex</span> <span class="dim">v0.167.0</span>\n<span class="dim">  model:</span> gpt-6.1-sol\n<span class="dim">  directory:</span> ~/Mashware/agent-terminal\n\n<span class="dim">────────────────────────────────────────</span>\n\nThe pane controls are ready for review.\n\n<span class="green">✓</span> Split controls and keyboard shortcuts\n<span class="green">✓</span> Preserve layout when restoring a pane\n<span class="green">✓</span> Keep background consoles running\n\n<span class="yellow">?</span> Waiting for your feedback on the header.\n\n<span class="blue">›</span> <span class="cursor"></span>',info:true},
2:{name:'app · release',branch:'main',text:'<span class="dim">~/Mashware/agent-terminal</span>\n\n<span class="blue">❯</span> cargo run -p app --release\n<span class="green">    Finished</span> `release` profile in 0.24s\n<span class="green">     Running</span> `target/release/app`\n\n<span class="dim">[window]</span> Layout restored · 3 consoles\n<span class="dim">[fonts] </span> JetBrains Mono · 14 pt\n<span class="dim">[panel] </span> Producer connected\n\n<span class="dim">Application is running.</span>'},
3:{name:'tests',branch:'main',text:'<span class="dim">~/Mashware/agent-terminal</span>\n\n<span class="blue">❯</span> cargo test -p app\n\n<span class="dim">running 128 tests</span>\ntest layout::split_right ... <span class="green">ok</span>\ntest layout::split_down ... <span class="green">ok</span>\ntest layout::restore_weights ... <span class="green">ok</span>\ntest panel::preserve_state ... <span class="green">ok</span>\n<span class="dim">...</span>\n\n<span class="green">test result: ok. 128 passed; 0 failed.</span>\n\n<span class="blue">❯</span> <span class="cursor"></span>'}};
let tabs=[{id:1,name:'agent-terminal',tree:{direction:'row',children:[1,{direction:'column',children:[2,3]}]}},{id:2,name:'backend',tree:4}];
let panes={...fixtures,4:{name:'backend',branch:'develop',text:'<span class="dim">~/Proyectos/backend</span>\n\n<span class="blue">❯</span> <span class="cursor"></span>'}};
function tab(){return tabs.find(t=>t.id===activeTab)}
function ids(tree){return typeof tree==='number'?[tree]:tree.children.flatMap(ids)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,2800)}
function panelIsVisible(p){return p.panelShown ?? Boolean(p.info)}
function togglePanel(id){panes[id].panelShown=!panelIsVisible(panes[id]);render()}
function paneHtml(id){const p=panes[id];return `<article class="pane ${focused===id?'focused':''}" data-pane="${id}"><header class="pane-header"><span class="pane-number">${String(id).padStart(2,'0')}</span><span class="pane-name" title="Double-click to rename">${escapeHtml(p.name)}</span><span class="pane-branch">/ ${escapeHtml(p.branch)}</span><div class="pane-actions"><button data-pane-action="panel" data-id="${id}" title="${panelIsVisible(p)?'Hide information panel':'Show information panel'}" aria-label="${panelIsVisible(p)?'Hide information panel':'Show information panel'}" aria-pressed="${panelIsVisible(p)}" style="${panelIsVisible(p)?'color:var(--accent);background:#a6b9e414':''}">${icon('panel')}</button><button data-pane-action="zoom" data-id="${id}" title="${zoom===id?'Restore pane':'Maximize pane'}" aria-label="${zoom===id?'Restore pane':'Maximize pane'}">${icon(zoom===id?'restore':'maximize')}</button><button class="pane-close" data-pane-action="close" data-id="${id}" title="Close pane" aria-label="Close pane" ${ids(tab().tree).length===1?'disabled':''}>${icon('close')}</button></div></header><div class="pane-body"><div class="console" tabindex="0" aria-label="${escapeHtml(p.name)} console">${p.text}</div>${panelIsVisible(p)?`<aside class="information">${p.info?`<div class="attention">? &nbsp; Waiting for you</div><div class="eyebrow">UI · Pane controls</div><h3>A clearer home for every console</h3><div class="step done">✓ <span>Global toolbar</span></div><div class="step done">✓ <span>Pane title and controls</span></div><div class="step current">→ <span>Review the interaction</span></div><div class="step">○ <span>Implement in the terminal</span></div><div class="panel-foot">Published by the producer<br>Updated just now</div>`:`<div class="eyebrow">Information panel</div><h3>${escapeHtml(p.name)}</h3><div style="color:var(--muted)">No state published yet.</div>`}</aside>`:''}</div></article>`}
function treeHtml(tree){return typeof tree==='number'?paneHtml(tree):`<div class="branch ${tree.direction==='column'?'column':''}">${tree.children.map(treeHtml).join('')}</div>`}
function render(){
 $('#tabs').innerHTML=tabs.map(t=>`<button class="tab ${t.id===activeTab?'active':''}" data-tab="${t.id}" aria-current="${t.id===activeTab?'page':'false'}"><span>${ids(t.tree).some(id=>panes[id].info)?'<i class="claim" title="Waiting for you"></i>':''}${escapeHtml(t.name)}</span><span class="x" data-close-tab="${t.id}" role="button" tabindex="0" aria-label="Close ${escapeHtml(t.name)} tab">×</span></button>`).join('')+`<button class="tab-add" data-action="new-tab" title="New tab" aria-label="New tab">${icon('plus')}</button>`;
 $('#workspace').innerHTML=zoom?paneHtml(zoom):treeHtml(tab().tree);
 $('#title-context').textContent='/ '+tab().name;
 $('#status').innerHTML=zoom?`<span class="zoom-note">${escapeHtml(panes[zoom].name)} maximized · other consoles keep running</span>`:`<b>${escapeHtml(panes[focused].name)}</b> &nbsp; / &nbsp; ${ids(tab().tree).length} consoles`;
 $('#hint').textContent=zoom?'Click restore to recover the previous layout':'Ctrl + Shift + D / Split right';
 if(searchOpen)mountSearch();
}
function replace(tree,id,replacement){if(typeof tree==='number')return tree===id?replacement:tree;return {...tree,children:tree.children.map(t=>replace(t,id,replacement))}}
function remove(tree,id){if(typeof tree==='number')return tree===id?null:tree;const children=tree.children.map(t=>remove(t,id)).filter(t=>t!==null);return children.length===1?children[0]:{...tree,children}}
function split(direction){if(ids(tab().tree).length>=6)return toast('This demo supports up to six consoles per tab.');const id=++nextId;panes[id]={name:'shell',branch:'main',text:'<span class="dim">~/Mashware/agent-terminal</span>\n\n<span class="blue">❯</span> <span class="cursor"></span>'};tab().tree=replace(tab().tree,focused,{direction,children:[focused,id]});focused=id;zoom=null;render()}
function newTab(){const id=++nextId;panes[id]={name:'shell',branch:'main',text:'<span class="dim">~</span>\n\n<span class="blue">❯</span> <span class="cursor"></span>'};tabs.push({id,name:'Terminal '+tabs.length,tree:id});activeTab=id;focused=id;zoom=null;searchOpen=false;render()}
function mountSearch(){const body=$(`[data-pane="${focused}"] .pane-body`);if(!body)return;const bar=document.createElement('div');bar.className='searchbar';bar.innerHTML=`<input aria-label="Search console" placeholder="Find in this console…" value="${escapeHtml(query)}"><span class="search-count">0 / 0</span><button data-search="prev" title="Previous match" aria-label="Previous match">↑</button><button data-search="next" title="Next match" aria-label="Next match">↓</button><button data-search="close" title="Close search" aria-label="Close search">${icon('close')}</button>`;body.append(bar);bar.querySelector('input').addEventListener('input',e=>{query=e.target.value;matchIndex=0;highlight()});highlight()}
function highlight(){const consoleEl=$(`[data-pane="${focused}"] .console`);if(!consoleEl)return;consoleEl.innerHTML=panes[focused].text;let count=0;if(query){const walk=document.createTreeWalker(consoleEl,NodeFilter.SHOW_TEXT);const nodes=[];while(walk.nextNode())nodes.push(walk.currentNode);for(const node of nodes){const text=node.textContent;let start=0,pos,frag=document.createDocumentFragment();while((pos=text.toLowerCase().indexOf(query.toLowerCase(),start))>=0){frag.append(text.slice(start,pos));let mark=document.createElement('mark');mark.textContent=text.slice(pos,pos+query.length);mark.dataset.match=count++;frag.append(mark);start=pos+query.length}frag.append(text.slice(start));node.replaceWith(frag)}}if(count)matchIndex=(matchIndex+count)%count;else matchIndex=0;const label=$('.search-count');if(label)label.textContent=`${count?matchIndex+1:0} / ${count}`;consoleEl.querySelectorAll('mark').forEach((m,i)=>m.style.outline=i===matchIndex?'2px solid #f7d394':'none');return count}
function openSearch(){searchOpen=true;query='';matchIndex=0;render();$('.searchbar input').focus()}
function settingsFields(){const el=$('#settings-fields');if(settingsSection==='Appearance'){el.innerHTML=`<div class="field"><label for="theme">Theme</label><select id="theme"><option>Graphite</option><option>Tokyo Night</option><option>Warm dark</option></select></div><div class="field"><label for="font-size">Font size</label><input id="font-size" type="number" min="10" max="20" value="${draft.size}"><small>Changes apply to this preview when saved.</small></div>`;$('#theme').value=draft.theme;$('#theme').onchange=e=>draft.theme=e.target.value;$('#font-size').oninput=e=>draft.size=Number(e.target.value)}else if(settingsSection==='Cursor'){el.innerHTML=`<div class="field"><label><input id="blink" type="checkbox" ${draft.blink?'checked':''}> Blink cursor</label><small>Preview the cursor behaviour in each console.</small></div>`;$('#blink').onchange=e=>draft.blink=e.target.checked}else el.innerHTML='<div style="line-height:2.5;font-size:12px">Split right <span style="float:right;color:#a6b9e4">Ctrl Shift D</span><br>Split down <span style="float:right;color:#a6b9e4">Ctrl Shift B</span><br>Search console <span style="float:right;color:#a6b9e4">Ctrl Shift F</span><br>New tab <span style="float:right;color:#a6b9e4">Ctrl Shift T</span></div>'}
function preferences(){draft={...applied};settingsSection='Appearance';document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('selected',b.dataset.section===settingsSection));settingsFields();$('#settings').showModal()}
function act(a){$('#app-menu').hidden=true;$('#menu-toggle').setAttribute('aria-expanded','false');switch(a){case'split-right':split('row');break;case'split-down':split('column');break;case'new-tab':newTab();break;case'search':openSearch();break;case'menu':$('#app-menu').hidden=false;$('#menu-toggle').setAttribute('aria-expanded','true');break;case'panel':togglePanel(focused);break;case'settings':preferences();break;case'shortcuts':preferences();settingsSection='Shortcuts';document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('selected',b.dataset.section===settingsSection));settingsFields();break;case'cancel-settings':$('#settings').close();break;case'save-settings':if(!Number.isFinite(draft.size)||draft.size<10||draft.size>20){toast('Choose a font size between 10 and 20.');break}applied={...draft};document.documentElement.style.setProperty('--size',applied.size+'px');document.documentElement.style.setProperty('--terminal',applied.theme==='Tokyo Night'?'#1a1b26':applied.theme==='Warm dark'?'#24211e':'#17191d');document.documentElement.style.setProperty('--accent',applied.theme==='Warm dark'?'#d9ad80':'#a6b9e4');let style=$('#cursor-style');if(!style){style=document.createElement('style');style.id='cursor-style';document.head.append(style)}style.textContent=applied.blink?'@keyframes blink{50%{opacity:0}}.focused .cursor{animation:blink 1.2s step-end infinite}':'';$('#settings').close();toast('Preview preferences applied.');break;case'window-max':$('#app').classList.toggle('expanded');document.querySelector('[data-action="window-max"]').innerHTML=icon($('#app').classList.contains('expanded')?'restore':'maximize');break;case'minimize':toast('Minimize window · simulated in this HTML demo.');break;case'window-close':toast('Close window · simulated in this HTML demo.');break;case'reset':location.reload();break}}
document.addEventListener('click',e=>{
 const paneAction=e.target.closest('[data-pane-action]');if(paneAction){const id=Number(paneAction.dataset.id);if(paneAction.dataset.paneAction==='panel'){togglePanel(id);return}focused=id;if(paneAction.dataset.paneAction==='zoom'){zoom=zoom===id?null:id}else if(ids(tab().tree).length>1){tab().tree=remove(tab().tree,id);delete panes[id];focused=ids(tab().tree)[0];zoom=null}render();return}
 const closeTab=e.target.closest('[data-close-tab]');if(closeTab){const id=Number(closeTab.dataset.closeTab);if(tabs.length===1)return toast('Keep one tab open in this demo.');tabs=tabs.filter(t=>t.id!==id);if(activeTab===id){activeTab=tabs[0].id;focused=ids(tab().tree)[0];zoom=null;searchOpen=false}render();return}
 const tabButton=e.target.closest('[data-tab]');if(tabButton){activeTab=Number(tabButton.dataset.tab);focused=ids(tab().tree)[0];zoom=null;searchOpen=false;render();return}
 const action=e.target.closest('[data-action]');if(action){if(action.dataset.action==='menu'&&!$('#app-menu').hidden){$('#app-menu').hidden=true;$('#menu-toggle').setAttribute('aria-expanded','false')}else act(action.dataset.action);return}
 const section=e.target.closest('[data-section]');if(section){settingsSection=section.dataset.section;document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('selected',b===section));settingsFields();return}
 const search=e.target.closest('[data-search]');if(search){if(search.dataset.search==='close'){searchOpen=false;render()}else{matchIndex+=search.dataset.search==='next'?1:-1;highlight()}return}
 if(!e.target.closest('#app-menu')){$('#app-menu').hidden=true;$('#menu-toggle').setAttribute('aria-expanded','false')}
 const pane=e.target.closest('[data-pane]');if(pane&&Number(pane.dataset.pane)!==focused){focused=Number(pane.dataset.pane);searchOpen=false;render()}
});
document.addEventListener('dblclick',e=>{const name=e.target.closest('.pane-name');if(name){const id=Number(name.closest('[data-pane]').dataset.pane),input=document.createElement('input');input.value=panes[id].name;input.style.cssText='width:140px;background:#181b21;border:1px solid #8599bf;color:#dde5f3;border-radius:3px;font-size:12px;padding:2px 5px';name.replaceWith(input);input.focus();input.select();let committed=false;const commit=()=>{if(committed)return;committed=true;panes[id].name=input.value.trim()||panes[id].name;render()};input.onblur=commit;input.onkeydown=e=>{if(e.key==='Enter')commit();if(e.key==='Escape'){committed=true;render()}}}else if(e.target.closest('.titlebar')&&!e.target.closest('button,#app-menu'))act('window-max')});
document.addEventListener('keydown',e=>{if($('#settings').open)return;if(e.target.matches('[data-close-tab]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.click();return}if(e.key==='Escape'){searchOpen=false;$('#app-menu').hidden=true;$('#menu-toggle').setAttribute('aria-expanded','false');render();return}if(e.target.closest('.searchbar')&&e.key==='Enter'){e.preventDefault();matchIndex+=e.shiftKey?-1:1;highlight();return}if(e.target.matches('input,select,textarea'))return;if(e.ctrlKey&&e.shiftKey){const a={d:'split-right',b:'split-down',t:'new-tab',f:'search'}[e.key.toLowerCase()];if(a){e.preventDefault();act(a)}}if(e.ctrlKey&&e.key===','){e.preventDefault();preferences()}});
$('#chrome-toggle').onclick=()=>{$('#app').classList.toggle('native');$('#chrome-toggle').textContent=$('#app').classList.contains('native')?'Back to integrated titlebar':'Compare with system titlebar'};
render();
</script>
</html>
