name: Ivy packages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected tag as an unsigned Linux, macOS and Windows prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ivy-package-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libxkbcommon-dev libssl-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Check documentation links
        run: cargo doc-check --locked
      - name: Test portable packaging logic
        run: python3 -m unittest scripts/test_release.py scripts/test_macos.py scripts/test_windows.py -v

  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate selected tag for publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python3 scripts/release.py version --tag "$REF_NAME"
          scripts/verify-release-tag.sh "$REF_NAME" "$EXPECTED_COMMIT"
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libxkbcommon-dev libssl-dev pkg-config dpkg-dev binutils desktop-file-utils
      - name: Build pinned workspace binaries
        run: cargo build --locked --release -p app -p panel-control --bins
      - name: Package and record checksums
        env:
          COMMIT: ${{ github.sha }}
        run: |
          cargo metadata --locked --filter-platform x86_64-unknown-linux-gnu --format-version 1 > target/release-metadata.json
          python3 scripts/release.py notices --metadata target/release-metadata.json --directory target/release/notices
          version=$(python3 scripts/release.py version)
          scripts/package-linux.sh --binary-dir target/release --output-dir dist --version "$version"
          scripts/test-linux-package.sh dist/*.deb "$version" target/release/notices
          python3 -m unittest scripts/test_release.py scripts/test_macos.py scripts/test_windows.py -v
          python3 scripts/release.py generate --directory dist --commit "$COMMIT" --built-on ubuntu-24.04
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload package and metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ivy-linux-x86_64
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        ubuntu: ['24.04', '26.04']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ivy-linux-x86_64
          path: dist
      - name: Install, upgrade and remove in a disposable Ubuntu container
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          docker run --rm --env IVY_DISPOSABLE_CONTAINER=yes \
            --mount "type=bind,src=$PWD/packaging/linux,dst=/checks,readonly" \
            --mount "type=bind,src=$PWD/dist,dst=/dist,readonly" \
            "ubuntu:$UBUNTU_VERSION" bash -euc '
              set -- /dist/*.deb
              test "$#" -eq 1
              package=$1
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y "$package" python3 xvfb xauth xdotool
              dpkg -r ivy-terminal
              /checks/test-install.sh "$package"
            '

  arch:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ivy-linux-x86_64
          path: baseline
      - name: Prepare the verified shared Linux payload
        run: |
          (cd baseline && sha256sum --check SHA256SUMS)
          dpkg-deb -x baseline/*.deb payload
          tar -cf payload.tar -C payload usr
          mkdir arch-dist
      - name: Build and test native Arch package
        run: |
          version=$(python3 scripts/release.py version)
          docker run --rm --env IVY_DISPOSABLE_CONTAINER=yes --env VERSION="$version" \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            --mount "type=bind,src=$PWD/payload.tar,dst=/payload.tar,readonly" \
            --mount "type=bind,src=$PWD/arch-dist,dst=/out" \
            archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm --needed python fontconfig libx11 libxcb libxcursor libxi libxrandr libxkbcommon libxkbcommon-x11 wayland libglvnd mesa xorg-server-xvfb xorg-xauth xdotool desktop-file-utils diffutils
              useradd -m -u 1000 builder
              chown builder /out
              runuser -u builder -- /src/scripts/package-arch.sh /payload.tar /out "$VERSION"
              arch_version=${VERSION/-/}
              arch_version=${arch_version/alpha./alpha}
              arch_version=${arch_version/beta./beta}
              arch_version=${arch_version/rc./rc}
              /src/packaging/arch/test-package.sh /out/*.pkg.tar.zst /payload.tar "$arch_version"
              /src/packaging/arch/test-install.sh /out/*.pkg.tar.zst "$VERSION"
              /src/packaging/arch/test-package.sh --versions
            '
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ivy-arch-x86_64
          path: arch-dist/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build pinned native Mac executables
        run: |
          rustup target add "$TARGET"
          cargo build --locked --release --target "$TARGET" -p app -p panel-control --bins
      - name: Bundle original notices and create DMG
        run: |
          cargo metadata --locked --filter-platform "$TARGET" --format-version 1 > target/release-metadata.json
          python3 scripts/release.py notices --metadata target/release-metadata.json --directory "target/$TARGET/release/notices"
          version=$(python3 scripts/release.py version)
          python3 scripts/package-macos.py build --binary-dir "target/$TARGET/release" --directory dist --version "$version" --arch "$ARCH"
          python3 -m unittest scripts/test_macos.py -v
          python3 packaging/macos/test-install.py dist/*.dmg "$version" "$ARCH" "target/$TARGET/release/notices" "dist/Ivy-$version-macos-$ARCH.executables.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ivy-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build pinned native Windows executables
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p app -p panel-control --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --locked --filter-platform x86_64-pc-windows-msvc --format-version 1 > target/release-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build per-user installer with original notices
        shell: pwsh
        run: |
          python scripts/release.py notices --metadata target/release-metadata.json --directory target/x86_64-pc-windows-msvc/release/notices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Version = python scripts/release.py version
          python scripts/package-windows.py --binary-dir target/x86_64-pc-windows-msvc/release --output-dir dist --version $Version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installed payload, replacement and removal
        shell: pwsh
        env:
          IVY_DISPOSABLE_RUNNER: 'yes'
        run: |
          $Installer = (Get-ChildItem dist/*-setup.exe).FullName
          ./packaging/windows/test-install.ps1 -Installer $Installer -BinaryDir target/x86_64-pc-windows-msvc/release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ivy-windows-x86_64
          path: dist/*-setup.exe
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [build, install, arch, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ivy-*
          path: dist
          merge-multiple: true
      - name: Validate and publish complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          test "$REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$COMMIT"
          (cd dist && sha256sum --check SHA256SUMS)
          python3 scripts/release.py generate --directory dist --commit "$COMMIT" --built-on ubuntu-24.04 --tag "$TAG" --include-arch --include-macos --include-windows
          (cd dist && sha256sum --check SHA256SUMS)
          scripts/verify-release-tag.sh "$TAG" "$COMMIT"
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo 'A release already exists for this tag; inspect it instead of overwriting it.' >&2
            exit 1
          fi
          gh release create "$TAG" dist/*.deb dist/*.pkg.tar.zst dist/*.dmg dist/*-setup.exe dist/release-manifest.json dist/SHA256SUMS --verify-tag --draft --prerelease --title "$TAG" --notes "Unsigned experimental Ubuntu, Arch Linux, macOS and Windows packages."
          scripts/verify-release-tag.sh "$TAG" "$COMMIT"
          gh release edit "$TAG" --draft=false --prerelease
