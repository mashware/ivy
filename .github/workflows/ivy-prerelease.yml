name: Ivy packages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected tag as an unsigned Linux, macOS and Windows prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ivy-package-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libxkbcommon-dev libssl-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Check documentation links
        run: cargo doc-check --locked
      - name: Test portable packaging logic
        run: python3 -m unittest scripts/test_release.py scripts/test_macos.py scripts/test_windows.py -v
      - name: Check compiled Windows omission inventory on Linux
        run: python3 scripts/windows-test-report.py --platform linux
      - name: Test omission reporter fixtures
        run: python3 -m unittest scripts/test_windows_test_report.py scripts/test_windows_known_failures.py -v

  macos-panel-checks:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Test native panel routing and Codex launcher
        run: cargo test --locked -p panel-control
      - name: Prove native Codex daemon attribution regression
        run: python3 scripts/macos-codex-mutations.py

  # Keep this job name for branch protection. The full workspace suite now exercises Windows cfgs.
  windows-startup-checks:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # The reports print test names and reasons that are not all ASCII; the runner's console code
      # page would make Python fail on them.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check Windows launch helper contracts
        shell: pwsh
        run: ./packaging/windows/test-launch-contract.ps1
      - name: Prove Ctrl+Alt text with native Spanish and US keyboards
        shell: pwsh
        env:
          IVY_DISPOSABLE_RUNNER: 'yes'
        run: |
          cargo run --locked -p app --example windows_altgr 2>&1 | Tee-Object windows-altgr.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path windows-altgr.log -SimpleMatch 'PASS all 10 native keyboard cases')) {
            throw 'The native keyboard witness did not finish every case.'
          }
      - name: Prove native Ctrl+Alt regression detection
        shell: pwsh
        env:
          IVY_DISPOSABLE_RUNNER: 'yes'
        run: |
          python scripts/windows-altgr-mutation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep native Ctrl+Alt evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-altgr-evidence
          path: windows-altgr*.log
          if-no-files-found: warn
      - name: Check native full-queue reader completion before the workspace
        shell: pwsh
        run: |
          $name = 'tests::closing_with_the_channel_full_ends_reader_without_draining'
          cargo test --locked -p term-core --lib -- $name --exact --nocapture 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
      - name: Lint all Windows workspace targets
        shell: pwsh
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the Windows workspace against its known failures
        shell: pwsh
        run: |
          python scripts/windows-known-failures.py 2>&1 | Tee-Object windows-workspace.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows-fixture-tests.py windows-workspace.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove native Windows fixture regressions with mutations
        shell: pwsh
        run: |
          python scripts/windows-fixture-mutations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep Windows fixture test and mutation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-fixture-evidence
          path: |
            windows-workspace.log
            target/windows-fixture-mutations/*.log
          if-no-files-found: warn
      - name: Check compiler-listed Unix-only omissions
        shell: pwsh
        run: |
          python scripts/windows-test-report.py --platform windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check native console and diagnostic regressions
        shell: pwsh
        run: |
          foreach ($case in @(
            @('app', 'git_process::windows_tests::background_runner_does_not_allocate_a_console'),
            @('panel-control', 'codex_relay::windows_console_tests::capability_command_does_not_allocate_a_console'),
            @('app', 'diagnostics_log::tests::capture_without_an_original_stderr_keeps_startup_errors')
          )) {
            $name = $case[1]
            cargo test --locked -p $case[0] --lib -- $name --exact --nocapture 2>&1 | Tee-Object -Variable printed
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not ($printed -match [regex]::Escape("test $name ... ok"))) { throw "$name did not run and pass" }
          }
      - name: Prove background console witnesses detect regressions
        shell: pwsh
        run: |
          python scripts/windows-console-mutations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep named Windows startup witnesses
        shell: pwsh
        run: |
          cargo test --locked -p app --lib -- windows_startup 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'windows_startup_keeps_the_configuration_in_appdata',
                            'windows_startup_finds_a_configuration_directory',
                            'windows_startup_default_and_fallback_run_a_command') {
            if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
          }
      - name: Keep named Windows control transport witnesses
        shell: pwsh
        run: |
          cargo test --locked -p panel-contract -p panel-control 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'binding_is_what_binds_says',
                            'diagnostic_peer_is_the_connected_process',
                            'inspector_runs_once_and_its_observation_reaches_each_delivery',
                            'exited_windows_peer_and_its_clones_never_become_alive_again',
                            'a_substituted_process_cannot_authorize_the_fresh_connector',
                            'raw_windows_stream_cannot_manufacture_a_verified_peer',
                            'bootstrap_pipeline_is_not_promoted_to_the_verified_stream',
                            'raw_windows_publications_remain_unknown_without_a_witness',
                            'client_upgrade_uses_its_supplied_total_deadline',
                            'pending_rendezvous_timeout_drains_and_releases_its_name',
                            'a_different_process_on_the_second_pipe_is_refused_and_releases_the_name',
                            'a_verified_stream_clone_keeps_identity_and_io_after_the_original_is_dropped',
                            'stopping_after_the_redirect_cancels_and_releases_the_fresh_pipe',
                            'first_instance_refuses_a_duplicate_and_pipe_dacl_is_exact',
                            'fresh_panel_directory_has_the_required_owner_and_protected_acl',
                            'dropping_a_channel_cancels_and_drains_a_pending_accept',
                            'stop_cancels_idle_and_partial_reads_after_completion_is_drained',
                            'stop_cancels_a_write_to_a_peer_that_is_not_reading',
                            'held_snapshot_returns_busy_and_drop_joins_idle_worker',
                            'revocation_refuses_new_admissions_and_keeps_admitted_work_pending',
                            'timed_out_split_delivery_stays_pending_until_late_ui_completion',
                            'panic_and_spawn_failure_paths_still_join_and_close_slots',
                            'windows_client_rejects_wrong_server_before_sending_request_bytes',
                            'windows_endpoint_connect_uses_inherited_server_pid',
                            'windows_mcp_instructions_require_expected_pid_and_panel_set_round_trips',
                            'an_image_through_a_junction_named_with_a_trailing_dot_is_not_opened_by_the_bridge_on_windows',
                            'on_windows_the_one_spelling_is_the_whole_path_under_the_verbatim_prefix',
                            'on_windows_the_walk_asks_the_one_spelling_of_a_name_win32_rewrites') {
            if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
          }
      - name: Prove Windows peer regression witnesses with mutations
        shell: pwsh
        run: |
          python scripts/windows-peer-mutations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep named Windows control lifecycle witnesses
        shell: pwsh
        run: |
          cargo test --locked -p app --lib -- windows_control 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'windows_control_server_pid_is_separate_and_cleared_without_a_panel',
                            'windows_control_document_snapshot_tracks_commit_clear_and_failed_serialize',
                            'windows_control_native_wake_posts_without_waiting_for_dispatch',
                            'windows_control_plan_snapshots_follow_commit_retire_and_revoke_off_frame',
                            'windows_control_plan_snapshot_registration_cannot_miss_a_concurrent_commit') {
            if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
          }
      - name: Keep named native Windows process and publication witnesses
        shell: pwsh
        run: |
          cargo test --locked -p term-core --lib -- foreground::windows --test-threads=1 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'windows_foreground_root_and_other_console_and_revocation',
                            'windows_foreground_scope_moved_to_worker_observes_root_exit',
                            'windows_foreground_descendant_lifetime_signals_exit_259',
                            'windows_foreground_nested_descendant_is_inside',
                            'windows_foreground_sequence_agrees_with_telemetry_and_creation_order',
                            'windows_foreground_wow64_parameters_are_unsupported_without_losing_native_evidence',
                            'windows_foreground_observation_returns_the_exact_launched_executable',
                            'current_process_directory_and_arguments_agree_with_runtime') {
            if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
          }
          cargo test --locked -p app --lib -- windows_provenance_opened_panes 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = 'windows_provenance_opened_panes_label_only_verified_outside_and_keep_unknown'
          if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
      - name: Prove Windows publication and process regression witnesses with mutations
        shell: pwsh
        run: |
          python scripts/windows-provenance-mutations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the Windows path arms
        shell: pwsh
        # A filter exits 0 when it matches nothing, and a cfg typo compiles a test out in silence, so
        # the Windows-only tests have to be named in the output.
        run: |
          cargo test --locked -p app --lib -- windows_paths 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'windows_paths_project_identity_has_no_verbatim_prefix',
                            'windows_paths_roadmap_aliases_have_no_verbatim_prefix',
                            'windows_paths_untracked_file_symlink_is_not_followed',
                            'windows_paths_untracked_listing_runs_git_on_the_verbatim_root',
                            'windows_paths_tilde_follows_home_dir',
                            'windows_paths_a_link_planted_at_the_temporary_is_not_written_through',
                            'windows_paths_an_agents_image_through_a_junction_is_refused_by_the_window') {
            if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
          }
      - name: Test that a console ends with its program and closes without waiting
        shell: pwsh
        run: |
          # One at a time: each test starts PowerShell, and four cold starts at once on a runner
          # measure the runner rather than the close.
          cargo test --locked -p term-core --lib -- windows_exit --test-threads=1 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'windows_exit_ordinary_end_is_reported',
                            'windows_exit_close_ends_the_reader',
                            'windows_exit_close_ends_a_parked_writer',
                            'windows_exit_an_exit_code_of_259_is_an_ended_program') {
            if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
          }
      - name: Test that a directory report crosses the bundled console host
        shell: pwsh
        # The test needs the pair beside its own binary, so the binary is copied into a folder of its
        # own with it: in target/debug/deps every other test binary would load the pair too. It is
        # ignored by default and run here by name, and the output has to name it as passed (D112).
        run: |
          $built = cargo test --locked -p term-core --lib --no-run --message-format=json |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { } } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'term_core' -and $_.executable }
          if ($LASTEXITCODE -ne 0 -or -not $built) { throw 'the term-core test binary was not built' }
          $dir = New-Item -ItemType Directory -Force -Path target/conpty-test
          python scripts/conpty.py --to $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $built.executable $dir
          $test = Join-Path $dir (Split-Path $built.executable -Leaf)
          $name = 'windows_conpty_osc7_reaches_the_screen_through_the_bundled_host'
          & $test --ignored --exact "tests::$name" 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
          # The close tests again, now on the host an installed Ivy runs: the step above ran them on
          # the system's (D111, D112).
          & $test windows_exit --test-threads=1 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'windows_exit_ordinary_end_is_reported',
                            'windows_exit_close_ends_the_reader',
                            'windows_exit_close_ends_a_parked_writer',
                            'windows_exit_an_exit_code_of_259_is_an_ended_program') {
            if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass on the bundled host" }
          }
      - name: Test PowerShell startup, prompts and Codex routing
        shell: pwsh
        run: |
          cargo test --locked -p app --lib -- windows_powershell 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'windows_powershell_preparation_recognises_executables_and_keeps_profiles_enabled',
                            'windows_powershell_reports_encoded_directories_without_a_helper_and_clears_other_providers',
                            'windows_powershell_preserves_prompt_error_status_and_user_codex_commands') {
            if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
          }
          cargo test --locked -p panel-control --test ivy_codex_launch -- native_shell_entry 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'native_shell_entry_preserves_native_powershell_status_and_arguments',
                            'native_shell_entry_resolves_current_path_and_keeps_explicit_mode') {
            if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
          }
          $built = cargo test --locked -p app --lib --no-run --message-format=json |
            ForEach-Object { try { $_ | ConvertFrom-Json } catch { } } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'app' -and $_.executable }
          if ($LASTEXITCODE -ne 0 -or -not $built) { throw 'the app test binary was not built' }
          $dir = New-Item -ItemType Directory -Force -Path target/powershell-test
          python scripts/conpty.py --to $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $built.executable $dir
          $test = Join-Path $dir (Split-Path $built.executable -Leaf)
          $name = 'windows_powershell_prepared_startup_reports_cwd_through_bundled_conpty'
          & $test --ignored --exact "shell_integration::powershell::tests::$name" 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
      - name: Test that a reported Windows directory is stored as a Windows path
        shell: pwsh
        run: |
          cargo test --locked -p term-core --lib -- windows_paths 2>&1 | Tee-Object -Variable printed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in 'windows_paths_a_drive_report_is_stored_in_the_platform_s_own_form',
                            'windows_paths_accepts_the_session_hostname_but_not_a_different_host') {
            if (-not ($printed -match "$name \.\.\. ok$")) { throw "$name did not run and pass" }
          }

  build:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate selected tag for publication
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          test "$REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python3 scripts/release.py version --tag "$REF_NAME"
          scripts/verify-release-tag.sh "$REF_NAME" "$EXPECTED_COMMIT"
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libxkbcommon-dev libssl-dev pkg-config dpkg-dev binutils desktop-file-utils
      - name: Build pinned workspace binaries
        run: cargo build --locked --release -p app -p panel-control --bins
      - name: Package and record checksums
        env:
          COMMIT: ${{ github.sha }}
        run: |
          cargo metadata --locked --filter-platform x86_64-unknown-linux-gnu --format-version 1 > target/release-metadata.json
          python3 scripts/release.py notices --metadata target/release-metadata.json --directory target/release/notices
          version=$(python3 scripts/release.py version)
          scripts/package-linux.sh --binary-dir target/release --output-dir dist --version "$version"
          scripts/test-linux-package.sh dist/*.deb "$version" target/release/notices
          python3 -m unittest scripts/test_release.py scripts/test_macos.py scripts/test_windows.py -v
          python3 scripts/release.py generate --directory dist --commit "$COMMIT" --built-on ubuntu-24.04
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload package and metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ivy-linux-x86_64
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        ubuntu: ['24.04', '26.04']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ivy-linux-x86_64
          path: dist
      - name: Install, upgrade and remove in a disposable Ubuntu container
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          docker run --rm --env IVY_DISPOSABLE_CONTAINER=yes \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            --mount "type=bind,src=$PWD/dist,dst=/dist,readonly" \
            "ubuntu:$UBUNTU_VERSION" bash -euc '
              set -- /dist/*.deb
              test "$#" -eq 1
              package=$1
              # Ubuntu container images skip /usr/share/doc, which a desktop install keeps; the
              # license notices live there and dpkg --verify would report them missing.
              rm -f /etc/dpkg/dpkg.cfg.d/excludes
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y "$package" python3 xvfb xauth xdotool
              dpkg -r ivy-terminal
              /src/packaging/linux/test-install.sh "$package"
            '

  arch:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ivy-linux-x86_64
          path: baseline
      - name: Prepare the verified shared Linux payload
        run: |
          (cd baseline && sha256sum --check SHA256SUMS)
          dpkg-deb -x baseline/*.deb payload
          tar -cf payload.tar -C payload usr
          mkdir arch-dist
      - name: Build and test native Arch package
        run: |
          version=$(python3 scripts/release.py version)
          docker run --rm --env IVY_DISPOSABLE_CONTAINER=yes --env VERSION="$version" \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            --mount "type=bind,src=$PWD/payload.tar,dst=/payload.tar,readonly" \
            --mount "type=bind,src=$PWD/arch-dist,dst=/out" \
            archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm --needed python fontconfig libx11 libxcb libxcursor libxi libxrandr libxkbcommon libxkbcommon-x11 wayland libglvnd mesa xorg-server-xvfb xorg-xauth xdotool desktop-file-utils diffutils
              useradd -m -u 1000 builder
              chown builder /out
              runuser -u builder -- /src/scripts/package-arch.sh /payload.tar /out "$VERSION"
              arch_version=${VERSION/-/}
              arch_version=${arch_version/alpha./alpha}
              arch_version=${arch_version/beta./beta}
              arch_version=${arch_version/rc./rc}
              /src/packaging/arch/test-package.sh /out/*.pkg.tar.zst /payload.tar "$arch_version"
              /src/packaging/arch/test-install.sh /out/*.pkg.tar.zst "$VERSION"
              /src/packaging/arch/test-package.sh --versions
            '
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ivy-arch-x86_64
          path: arch-dist/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build pinned native Mac executables
        run: |
          rustup target add "$TARGET"
          cargo build --locked --release --target "$TARGET" -p app -p panel-control --bins
      - name: Bundle original notices and create DMG
        run: |
          cargo metadata --locked --filter-platform "$TARGET" --format-version 1 > target/release-metadata.json
          python3 scripts/release.py notices --metadata target/release-metadata.json --directory "target/$TARGET/release/notices"
          version=$(python3 scripts/release.py version)
          python3 scripts/package-macos.py build --binary-dir "target/$TARGET/release" --directory dist --version "$version" --arch "$ARCH"
          python3 -m unittest scripts/test_macos.py -v
          python3 packaging/macos/test-install.py dist/*.dmg "$version" "$ARCH" "target/$TARGET/release/notices" "dist/Ivy-$version-macos-$ARCH.executables.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ivy-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: windows-startup-checks
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && needs.windows-startup-checks.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build pinned native Windows executables
        shell: pwsh
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p app -p panel-control --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo metadata --locked --filter-platform x86_64-pc-windows-msvc --format-version 1 > target/release-metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build per-user installer with original notices
        shell: pwsh
        run: |
          python scripts/release.py notices --metadata target/release-metadata.json --directory target/x86_64-pc-windows-msvc/release/notices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/conpty.py --to target/conpty
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Version = python scripts/release.py version
          python scripts/package-windows.py --binary-dir target/x86_64-pc-windows-msvc/release --output-dir dist --version $Version --conpty-dir target/conpty
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch a pinned software OpenGL for the launch trials
        # Hosted runners have no GPU and Windows' own OpenGL 1.1 is below what egui_glow needs, so
        # the installed app cannot open a window there. Mesa's llvmpipe stands in, for the trials only.
        shell: pwsh
        run: |
          $Archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/25.3.6/mesa3d-25.3.6-release-msvc.7z' -OutFile $Archive
          if ((Get-FileHash $Archive -Algorithm SHA256).Hash -ne 'CA56D92BB2254A9A25557C95CFE27F02071A77B26DAFF4CBF9BC125ED3347FB5') { throw 'Mesa archive hash mismatch' }
          7z x $Archive "-o$env:RUNNER_TEMP\mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Found = @(Get-ChildItem "$env:RUNNER_TEMP\mesa" -Recurse -Filter opengl32.dll | Where-Object { $_.DirectoryName -match '(^|\\)x64$' })
          if ($Found.Count -ne 1) {
            Get-ChildItem "$env:RUNNER_TEMP\mesa" -Recurse -Filter *.dll | ForEach-Object { $_.FullName }
            throw "Expected one 64-bit opengl32.dll in the Mesa archive, found $($Found.Count)"
          }
          "MESA_X64=$($Found[0].DirectoryName)" >> $env:GITHUB_ENV
      - name: Check installed payload, launch, replacement and removal
        shell: pwsh
        env:
          IVY_DISPOSABLE_RUNNER: 'yes'
        run: |
          $Installer = (Get-ChildItem dist/*-setup.exe).FullName
          ./packaging/windows/test-install.ps1 -Installer $Installer -BinaryDir target/x86_64-pc-windows-msvc/release -ConptyDir target/conpty -SoftwareOpenGL $env:MESA_X64
      - name: Upload Windows launch evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-launch-evidence
          path: windows-launch-evidence/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ivy-windows-x86_64
          path: dist/*-setup.exe
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [build, install, arch, macos, windows, windows-startup-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ivy-*
          path: dist
          merge-multiple: true
      - name: Validate and publish complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          test "$REF_TYPE" = tag
          test "$(git rev-parse HEAD)" = "$COMMIT"
          (cd dist && sha256sum --check SHA256SUMS)
          python3 scripts/release.py generate --directory dist --commit "$COMMIT" --built-on ubuntu-24.04 --tag "$TAG" --include-arch --include-macos --include-windows
          (cd dist && sha256sum --check SHA256SUMS)
          scripts/verify-release-tag.sh "$TAG" "$COMMIT"
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo 'A release already exists for this tag; inspect it instead of overwriting it.' >&2
            exit 1
          fi
          gh release create "$TAG" dist/*.deb dist/*.pkg.tar.zst dist/*.dmg dist/*-setup.exe dist/release-manifest.json dist/SHA256SUMS --verify-tag --draft --prerelease --title "$TAG" --notes-file resources/release-notes.md
          scripts/verify-release-tag.sh "$TAG" "$COMMIT"
          gh release edit "$TAG" --draft=false --prerelease
