[package]
name = "term-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alacritty_terminal = "0.26"
portable-pty = "0.9"
# Escaping what a person typed so the engine's search reads it as text, not as a pattern (D61).
# Already in the tree through the engine's own search; named here because escaping is the one
# primitive that cannot miss a metacharacter.
regex-syntax = "0.8"

# Closing a console hangs up its program by pid instead of through `portable-pty`'s `kill`, whose
# 50 ms grid was the whole cost of the close. Already in the tree through that crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# **The engine, again and on purpose.** The benches in `examples/` measure the engine **below this
# crate's facade**: an example compiles as its own binary and does not see the crate's normal
# dependencies. Without this, measuring what the scrollback costs would mean opening a hole in the
# production API for an instrument — which is exactly the other way round from how it is decided here:
# you measure first, and the number decides what API is needed.
[dev-dependencies]
alacritty_terminal = "0.26"

# **Test support for whoever hosts this crate**: `received`, which reads what a console's program got
# from a file the program wrote. A host's tests reach it through a development dependency that turns
# this on. With resolver 3 that keeps it out of `cargo build` and `cargo run`; `cargo test` compiles
# the host's binary with it too, where it adds a type nothing calls.
[features]
testing = []
