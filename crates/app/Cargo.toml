[package]
name = "app"
version.workspace = true
edition.workspace = true

[dependencies]
eframe.workspace = true
term-core = { path = "../term-core" }
panel-contract = { path = "../panel-contract" }

# Para enterarse de que un productor ha publicado sin preguntarle al disco sesenta veces por segundo.
# Se leyó su fuente antes de elegirlo, y de ahí salen dos decisiones que no son negociables: se vigila
# el **directorio** de cada consola y no su fichero, y el aviso solo levanta una bandera.
# Sus features de serie son todas de macOS y llegan detrás de un `cfg` de plataforma, así que en Linux
# no añaden nada: lo que entra es `inotify`, `mio`, `walkdir` y `notify-types`.
notify = "8.2"

# Para el formato con el que la disposición de la ventana va y vuelve de disco.
#
# **No añaden ni un paquete al árbol, y conviene decirlo porque la intuición dice lo contrario.** El
# `Cargo.toml` de la raíz razona feature por feature lo que quita para que `clippy --workspace
# --all-targets` no se alargue, así que «meter `derive`» suena a ir contra esa política. No lo es: la
# política razona sobre **lo que entra al árbol**, y `serde` con `derive` ya se compila aquí por rebote
# del motor de terminal — comprobado con `cargo tree -i serde_derive`, que da
# `serde_derive → serde → alacritty_terminal → term-core → app`. `serde_json` también, por
# `panel-contract`.
#
# **Y se usa `derive`, al contrario que en `panel-contract`, por una razón y no por gusto.** Aquella caja
# lee con `Value` porque tolera **por campo** —siete opcionales, y líneas que son cadena o objeto—; este
# fichero lo escribe siempre la aplicación y **se tolera por documento**, así que no hay nada que tolerar
# a mano. Lo único que se compraría escribiéndolo a mano es el recorrido de un árbol recursivo, que es
# justo donde un intérprete a mano falla.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# No se usa desde el código: está solo para reponer una feature que se cayó al quitar los defaults
# de eframe. Sin ella, en Wayland la ventana la decora el marco de reserva de SCTK —que su propio
# autor llama «el marco feo por defecto»— y este hito existe para juzgar cómo pinta egui, así que
# un marco degradado ensucia justo lo que hay que mirar.
# La versión tiene que seguir a la que arrastre eframe: si se desincronizan, aparece un segundo
# winit en el árbol y esta línea deja de surtir efecto en silencio.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

# **Quién sabe qué caracteres son emoji y con qué presentación.** No es una tabla que se pueda escribir a
# mano ni deducir de un rango: `Emoji_Presentation` es una propiedad de Unicode que cambia con cada
# versión del estándar, y de ella depende que `☁` salga en texto y `☁️` a color.
#
# **Ojo con su enumerado: es `#[non_exhaustive]`.** Una categoría que añadan mañana cae en el caso por
# defecto y sale monocromo, sin que la compilación diga nada. Se acepta a sabiendas — ese carácter saldría
# **como sale hoy** — y está escrito en `fonts.rs`, que es donde se decide.
unicode-properties = { version = "0.1.4", features = ["emoji"] }

# **Quién sabe qué fuentes tiene la máquina, y cuál de ellas cubre un carácter.** Entró como dependencia
# de desarrollo cuando solo la usaba el banco de medida; desde que el terminal descubre fuentes de verdad
# es de producción.
#
# Es de los mismos autores que `skrifa` —que ya está en el árbol porque el motor de texto de egui la usa
# por debajo— así que las dos hablan el mismo modelo de fuente en vez de convivir dos. Y usa las APIs
# nativas de cada plataforma: fontconfig en Linux, DirectWrite en Windows, CoreText en macOS, que es lo
# que hace falta para no dejarle deuda a **F2.7**.
#
# **`fontconfig` se carga en EJECUCIÓN, no se enlaza al compilar.** Sin esa feature, compilar este repo en
# Linux pasa a exigir `pkg-config` y las cabeceras de fontconfig — comprobado: la máquina donde se escribió
# esto no las tiene y la compilación falla en el guion de construcción, no en el código. Es la misma
# técnica, y la misma razón, que el `dlopen` con el que `libwayland` llega de rebote. El precio es que la
# ausencia de fontconfig se descubre **al arrancar** y no al compilar — que es justo el caso que **AC9**
# obliga a aguantar.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }

# **Para comprobar que el motor de texto va a poder abrir una fuente ANTES de dársela.** Es la misma caja
# que epaint usa por debajo, así que lo que aquí se abra, allí se abre. Sin esta comprobación, un fichero
# de fuente corrupto —una actualización de paquete a medias, unos desplazamientos viejos de fontconfig—
# mata el proceso: el único modo de fallo que epaint tiene para bytes que no entiende es un pánico, y
# ocurre dentro de su pasada, donde no hay nada que pueda recogerlo.
skrifa = "0.44"

# **Para decodificar el mapa de bits de un emoji y reducirlo al tamaño de una celda.** Los glifos de color
# de `Noto Color Emoji` vienen dentro de la fuente como **PNG indexado por paleta** de 136×128 —comprobado
# ejecutándolo—, así que hay que expandirlos a RGBA y reescalarlos; `skrifa` entrega los bytes tal cual y
# no hace ni lo uno ni lo otro.
#
# **No añade ni un paquete ni una feature al árbol, y conviene decirlo porque la intuición dice lo
# contrario.** `image` con la feature `png` **ya se compila aquí** por rebote del portapapeles —comprobado
# con `cargo tree -e features -i image`, que da `image/png → arboard → egui-winit → eframe → app`—. Es el
# mismo argumento con el que `serde` con `derive` está justificado más arriba: la política del manifiesto
# de la raíz razona sobre **lo que entra al árbol**, no sobre cuántas líneas tiene el manifiesto.
image = { version = "0.25", default-features = false, features = ["png"] }


# **Solo para el banco de fuentes, y a propósito.** Esta entrega mide qué cuesta descubrir las fuentes
# del sistema y rasterizar un glifo a color; hasta que esos números decidan cómo se hace, nada de esto
# entra en producción. Es el mismo criterio con el que el banco del historial midió el motor por debajo
# de la fachada de `term-core`: primero el número, y el número decide qué API hace falta.
#
# `fontique` es de los mismos autores que `skrifa` —que **ya está en el árbol** porque el motor de texto
# de egui la usa por debajo— así que las dos hablan el mismo modelo de fuente en vez de convivir dos. Y
# usa las APIs nativas de cada plataforma: fontconfig en Linux, DirectWrite en Windows, CoreText en
# macOS, que es lo que hace falta para no dejarle deuda a **F2.7**.
# **Y `fontconfig` se carga en EJECUCIÓN, no se enlaza al compilar.** Sin esa feature, compilar este
# repo en Linux pasa a exigir `pkg-config` y las cabeceras de fontconfig — comprobado: la máquina donde
# se escribió esto no las tiene y la compilación **falla en el guion de construcción**, no en el código.
# Es la misma técnica, y la misma razón, que el `dlopen` con el que `libwayland` llega de rebote y que
# está razonada arriba: sin ella el binario dejaría de compilar donde hoy compila. El precio es que la
# ausencia de fontconfig se descubre **al arrancar** y no al compilar — que es justo el caso que AC9
# obliga a aguantar.
#
# **Y «de desarrollo» no significa «no toca el binario».** Las dependencias de desarrollo participan en la
# resolución de versiones: añadir `fontique` movió `windows-sys` de 0.59 a 0.60 para `arboard` —el
# portapapeles, que **sí** va en el binario publicado— y metió la pila de `windows 0.62`. En Linux no
# cambia nada; **en Windows, que es la plataforma de F2.7, ya cambia lo que se compila**. Queda dicho aquí
# porque el comentario de arriba, tal como estaba, prometía lo contrario.
[dev-dependencies]
host-load = { path = "../host-load" }

# **Para que las pruebas del banco corran con `cargo test`, y no solo si alguien se acuerda de pedir
# `--examples`.** Un `example` de cargo no es un objetivo de prueba de serie: el módulo `tests` de
# `examples/fonts.rs` se compilaría y no se ejecutaría nunca, que es peor que no tenerlo — una prueba
# que no corre se lee como cobertura y no lo es. Con esto entra en la suite del taller y en la de CI por
# el mismo camino que las demás.
[[example]]
name = "fonts"
test = true
