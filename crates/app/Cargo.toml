[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
semver = "1"
eframe.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
term-core = { path = "../term-core" }
panel-contract = { path = "../panel-contract" }

# The second transport of the panel document: the endpoint a producer speaks to instead of writing
# the file. It depends on nothing visual, exactly like the contract it carries, so the window takes it
# the same way it takes the contract — as a crate that would survive the interface being rewritten
# (D3).
panel-control = { path = "../panel-control" }

# A producer controls every string offered as a link. This parses the complete candidate before the
# app hands it to the desktop, so `http` and `https` with a host are one boundary shared by terminal
# text, OSC 8 and the panel instead of three partial string checks.
url = "2.5"

# The desktop's own opener, the one egui's `links` feature would call — named directly because that
# feature swallows its error into `log`, and a click the opener could not act on has to say why
# (D51). What it does with the address differs by platform: on Linux it runs the default browser, or
# `xdg-open` and its relatives, with the address as one argument; on macOS it asks AppKit's
# `NSWorkspace`; on Windows it runs the registered `http` handler's command line with the address
# substituted in. Under WSL it runs `cmd.exe /c start <address>`, escaping only `^` and `&` —
# which is why `links::WebTarget` percent-encodes what else `cmd` would read.
webbrowser = "1.2"

# Retirement snapshots must open a producer-controlled path without letting a FIFO block the
# interface thread. This package is already in the workspace graph; the direct dependency names the
# one Unix open flag the standard library deliberately leaves platform-specific.
libc = "0.2"

# **So that a handle is not guessable, which is the whole of its job.** `PANEL_ID` is in every
# descendant's environment and any sibling of this user reads it out of `/proc/<pid>/environ`, so a
# name is not a credential and a small integer is reachable by a typo; a handle is sixteen random
# bytes. It adds no package to the tree: `panel-contract` already draws randomness from it to name
# each console's directory.
getrandom = "0.3"

# To find out that a producer has published without asking the disk sixty times a second.
# Its source was read before choosing it, and two decisions come out of that reading which are not
# negotiable: what is watched is each console's **directory** and not its file, and the notice only
# raises a flag.
# Its default features are all macOS ones and arrive behind a platform `cfg`, so on Linux they add
# nothing: what comes in is `inotify`, `mio`, `walkdir` and `notify-types`.
notify = "8.2"

# For the format the window's layout goes to disk and comes back in.
#
# **They do not add a single package to the tree, and that is worth saying because intuition says the
# opposite.** The root `Cargo.toml` reasons feature by feature about what it strips so that
# `clippy --workspace --all-targets` does not drag on, so «pulling in `derive`» sounds like going
# against that policy. It is not: the policy reasons about **what enters the tree**, and `serde` with
# `derive` is already compiled here, pulled in by the terminal engine — checked with
# `cargo tree -i serde_derive`, which gives
# `serde_derive → serde → alacritty_terminal → term-core → app`. `serde_json` too, through
# `panel-contract`.
#
# **And `derive` is used, unlike in `panel-contract`, for a reason and not out of taste.** That crate
# reads with `Value` because it tolerates **per field** — seven optionals, and lines that are either a
# string or an object; this file is always written by the application and is tolerated **per
# document**, so there is nothing to tolerate by hand. The only thing writing it by hand would buy is
# the walk of a recursive tree, which is exactly where a hand-written interpreter fails.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Not used from the code: it is only here to put back a feature that fell when eframe's defaults were
# stripped. Without it, on Wayland the window is decorated by SCTK's fallback frame — which its own
# author calls «the ugly default frame» — and this milestone exists to judge how egui paints, so a
# degraded frame dirties exactly what has to be looked at.
# The version has to follow whatever eframe drags in: if the two drift apart, a second winit appears
# in the tree and this line silently stops having any effect.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

# **Who knows which characters are emoji and with which presentation.** It is not a table anybody can
# write by hand or derive from a range: `Emoji_Presentation` is a Unicode property that changes with
# every version of the standard, and whether `☁` comes out as text and `☁️` in colour depends on it.
#
# **Watch out for its enum: it is `#[non_exhaustive]`.** A category added tomorrow falls into the
# default arm and comes out monochrome, without the compilation saying a word. It is accepted
# knowingly — that character would come out **the way it comes out today** — and it is written down in
# `fonts.rs`, which is where the decision is made.
unicode-properties = { version = "0.1.4", features = ["emoji"] }

# **Who knows which fonts the machine has, and which of them covers a character.** It came in as a
# development dependency when only the measurement bench used it; since the terminal really discovers
# fonts, it belongs to production.
#
# It is by the same authors as `skrifa` — which is already in the tree because egui's text engine uses
# it underneath — so the two speak the same font model instead of two of them coexisting. And it uses
# each platform's native APIs: fontconfig on Linux, DirectWrite on Windows, CoreText on macOS, which
# is what it takes not to leave debt for **F2.7**.
#
# **`fontconfig` is loaded at RUN TIME, it is not linked at compile time.** Without that feature,
# compiling this repository on Linux starts demanding `pkg-config` and fontconfig's headers — checked:
# the machine where this was written does not have them and the compilation fails in the build script,
# not in the code. It is the same technique, and the same reason, as the `dlopen` that `libwayland`
# arrives by. The price is that fontconfig's absence is discovered **at start-up** and not at compile
# time — which is exactly the case **AC9** requires the application to survive.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }

# **To check that the text engine is going to be able to open a font BEFORE handing it over.** It is
# the same crate epaint uses underneath, so whatever opens here opens there. Without that check, a
# corrupt font file — a half-finished package update, some stale fontconfig offsets — kills the
# process: epaint's only failure mode for bytes it does not understand is a panic, and it happens
# inside its own pass, where there is nothing that can catch it.
skrifa = "0.44"

# **Who shapes a keycap into the glyph that draws it.** The emoji font draws `1️⃣` as a ligature of
# the whole sequence, which only shaping reaches; mapping the digit gives its thin `1` instead. Chosen
# because it is the shaper epaint runs underneath, rather than bringing a second one into the tree.
harfrust = "0.12"

# **To decode an emoji's bitmap and shrink it to the size of a cell.** `Noto Color Emoji`'s colour
# glyphs come inside the font as **palette-indexed PNG** of 136×128 — checked by running it — so they
# have to be expanded to RGBA and rescaled; `skrifa` hands the bytes over as they are and does neither.
#
# **It adds neither a package nor a feature to the tree, and that is worth saying because intuition
# says the opposite.** `image` with the `png` feature **is already compiled here**, pulled in by the
# clipboard — checked with `cargo tree -e features -i image`, which gives
# `image/png → arboard → egui-winit → eframe → app`. It is the same argument that justifies `serde`
# with `derive` above: the root manifest's policy reasons about **what enters the tree**, not about
# how many lines the manifest has.
image = { version = "0.25", default-features = false, features = ["png"] }

# **A development dependency is not «it does not touch the binary», and this is where that was
# learnt.** They take part in version resolution: adding `fontique` here — before it moved up to
# production, above — pushed `windows-sys` from 0.59 to 0.60 for `arboard`, the clipboard, which
# **does** ship in the published binary, and pulled in the `windows 0.62` stack. On Linux nothing
# changed; on Windows, which is F2.7's platform, it already changed what gets compiled.
# Clipboard reads run away from the UI; normal Copy keeps egui's existing writer.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-clipboard = "0.7.3"

[dev-dependencies]
host-load = { path = "../host-load" }

# **The same crate again, for its test support**: `term_core::received` reads what a console's
# program got from a file the program wrote, where the line discipline's echo cannot forge it. As a
# development dependency its feature stays out of `cargo build` and `cargo run` (resolver 3);
# `cargo tree -p app -e normal,features -i term-core` is how to see which features a build takes.
term-core = { path = "../term-core", features = ["testing"] }

# **So that the bench's tests run with `cargo test`, and not only if somebody remembers to ask for
# `--examples`.** A cargo example is not a test target by default: the `tests` module of
# `examples/fonts.rs` would be compiled and never run, which is worse than not having it — a test that
# does not run reads as coverage and is not. With this it joins the workshop's suite and CI's by the
# same path as the rest.
[[example]]
name = "fonts"
test = true
